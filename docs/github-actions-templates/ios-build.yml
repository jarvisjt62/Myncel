# iOS Build + TestFlight Upload
#
# Triggered on every push to main. Builds the Capacitor iOS app on a free
# macOS GitHub Actions runner, signs it with the cert from match, and
# uploads it to TestFlight via the App Store Connect API.
#
# Build time: ~15–25 min per run.
# Cost: $0 (under the GitHub Actions free tier).

name: iOS Build & TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.myncel.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "false"
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Capacitor sync (copy web assets to native iOS project)
        run: npx cap sync ios

      - name: Setup Ruby + Bundler (for fastlane + cocoapods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install fastlane + cocoapods
        run: |
          gem install fastlane -NV
          gem install cocoapods -NV

      - name: pod install
        working-directory: ios/App
        run: pod install --repo-update

      - name: Create temporary keychain
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 7200 -u "$KEYCHAIN"

      - name: Write App Store Connect API key JSON
        run: |
          mkdir -p ~/.appstoreconnect
          cat > ~/.appstoreconnect/api_key.json <<EOF
          {
            "key_id": "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}",
            "issuer_id": "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}",
            "key": $(printf '%s' "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" | jq -Rs .),
            "in_house": false
          }
          EOF

      - name: Fetch signing certificate via match (read-only)
        run: |
          fastlane match appstore \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$APPLE_TEAM_ID" \
            --git_url "$MATCH_GIT_URL" \
            --keychain_name build.keychain \
            --keychain_password "$KEYCHAIN_PASSWORD" \
            --api_key_path ~/.appstoreconnect/api_key.json \
            --readonly=true

      - name: Set build number from GitHub run number
        working-directory: ios/App
        run: |
          # Use the GitHub run number as the iOS buildNumber so each push
          # produces a unique TestFlight build.
          BUILD_NUMBER=${{ github.run_number }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          echo "Set CFBundleVersion to $BUILD_NUMBER"

      - name: Configure App target signing (App target only, not Pods)
        working-directory: ios/App
        run: |
          # Use Ruby + xcodeproj gem to surgically set signing on ONLY the App target.
          # This avoids the "X does not support provisioning profiles" error for Pods.
          gem install xcodeproj -NV

          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = 'App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          team_id = ENV['APPLE_TEAM_ID']
          bundle_id = ENV['BUNDLE_ID']
          profile_name = "match AppStore #{bundle_id}"

          project.targets.each do |target|
            next unless target.name == 'App'   # ONLY the App target
            target.build_configurations.each do |config|
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_name
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
              puts "Set signing for App target / #{config.name}: team=#{team_id}, profile=#{profile_name}"
            end
          end
          project.save
          RUBY

      - name: Build & archive .ipa
        working-directory: ios/App
        run: |
          set -o pipefail
          mkdir -p build

          # Show what provisioning profile match installed (helps debug signing issues)
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo "--- Available signing identities ---"
          security find-identity -v -p codesigning build.keychain || true

          # Note: signing is now set on the App target itself (see previous step).
          # We do NOT pass DEVELOPMENT_TEAM / PROVISIONING_PROFILE_SPECIFIER on the
          # command line, because that would force them onto the Pods targets too,
          # which don't accept provisioning profiles.
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            archive 2>&1 | tee build/xcodebuild-archive.log

          if [ ! -d build/App.xcarchive ]; then
            echo "::error::Archive not created. Last 100 lines of build log:"
            tail -n 100 build/xcodebuild-archive.log
            exit 1
          fi

          # Export the archive into an .ipa file
          cat > build/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>match AppStore $BUNDLE_ID</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/exportOptions.plist \
            -exportPath build/ipa \
            2>&1 | tee build/xcodebuild-export.log

          ls -lah build/ipa/

      - name: Upload .ipa as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myncel-iOS-${{ github.run_number }}.ipa
          path: ios/App/build/ipa/*.ipa
          retention-days: 30

      - name: Upload xcodebuild logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ github.run_number }}
          path: |
            ios/App/build/xcodebuild-*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload to TestFlight via App Store Connect API
        working-directory: ios/App
        run: |
          IPA_PATH=$(ls build/ipa/*.ipa | head -1)
          echo "Uploading $IPA_PATH to TestFlight..."

          fastlane pilot upload \
            --ipa "$IPA_PATH" \
            --api_key_path ~/.appstoreconnect/api_key.json \
            --skip_waiting_for_build_processing true \
            --skip_submission true

      - name: Done
        run: |
          echo "✅ Build #${{ github.run_number }} uploaded to TestFlight."
          echo "Apple typically processes the build in 5–15 min."
          echo "Check status at: https://appstoreconnect.apple.com/apps"
